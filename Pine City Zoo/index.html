<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="../style.css">
    <style>
        .zoo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; background: var(--border); margin: 0 8%; border: 1px solid var(--border); }
        .animal-card { background: white; padding: 60px; }
    </style>
</head>
<body>
    <header style="padding: 100px 8%; text-align: center;">
        <h1 style="font-family: var(--serif); font-size: 3rem;">Pine City Zoo</h1>
        <p style="color: var(--gold); letter-spacing: 2px;">Preserving the Natural World</p>
    </header>
    <div class="zoo-grid">
        <div class="animal-card">
            <h2 style="font-family: var(--serif);">African Elephant</h2>
            <p>Loxodonta africana. Majestic giants of the savannah.</p>
        </div>
        <div class="animal-card">
            <h2 style="font-family: var(--serif);">Bengal Tiger</h2>
            <p>Panthera tigris tigris. Power and grace in the wild.</p>
        </div>
    </div>
</body>
</html>
