<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../style.css">
    <style>
        :root { --gold: #C5A059; --dark: #1a1a1a; }
        body { margin: 0; font-family: 'Inter', sans-serif; display: flex; height: 100vh; background: #000; color: white; }
        .sidebar { width: 300px; border-right: 2px solid var(--gold); padding: 30px; overflow-y: auto; background: var(--dark); }
        .main { flex: 1; padding: 60px; overflow-y: auto; background: radial-gradient(circle at top right, #222, #000); }
        .nav-item { padding: 10px; cursor: pointer; color: #888; border-bottom: 1px solid #333; transition: 0.3s; }
        .nav-item:hover { color: var(--gold); padding-left: 20px; }
        .info-card { background: rgba(255,255,255,0.05); padding: 40px; border-left: 5px solid var(--gold); border-radius: 4px; }
        .tag { display: inline-block; padding: 5px 15px; background: var(--gold); color: black; font-weight: bold; border-radius: 20px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="color: var(--gold);">PINE CITY ZOO</h2>
        <div id="nav"></div>
    </div>
    <div class="main" id="display-area">
        <div class="info-card">
            <h1>Sector Analysis</h1>
            <p>Select a species or facility to view integrated data records.</p>
        </div>
    </div>

    <script>
        const zooData = {
            "lion": { name: "African Lion", info: "Pride management in Savanna sector. Health: 85%.", diet: "Carnivore" },
            "giraffe": { name: "Reticulated Giraffe", info: "Woodlands habitat. High-altitude foliage monitoring.", diet: "Herbivore" },
            "gorilla": { name: "Gorilla Trek", info: "Critically endangered. Silverback leadership tracking.", diet: "Herbivore" },
            "gemsbok": { name: "Gemsbok", info: "Desert plains adaptation. High endurance monitoring.", diet: "Herbivore" },
            "elephant": { name: "Elephant Sanctuary", info: "Intelligence markers: Superior. Social group stable.", diet: "Herbivore" },
            "panda": { name: "Panda Habitat", info: "Temperature controlled. Bamboo supply 100%.", diet: "Omnivore" },
            "dine": { name: "Dine @ The Zoo", info: "Main guest facility. Capacity: 150.", type: "Service" },
            "coffee": { name: "Wild Things Coffee", info: "Retail sector. Operational hours: 08:00 - 17:00.", type: "Service" },
            "weather": { name: "Weather Station", info: "Current: 24°C. Humidity: 45%.", type: "Telemetry" }
        };

        const nav = document.getElementById('nav');
        Object.keys(zooData).forEach(key => {
            const div = document.createElement('div');
            div.className = 'nav-item';
            div.innerText = zooData[key].name;
            div.onclick = () => {
                document.getElementById('display-area').innerHTML = `
                    <div class="info-card">
                        <span class="tag">${zooData[key].type || 'Species'}</span>
                        <h1>${zooData[key].name}</h1>
                        <p style="font-size: 1.2rem; line-height: 1.6;">${zooData[key].info}</p>
                        <hr style="border: 0; border-top: 1px solid #444; margin: 20px 0;">
                        <strong>Log Status:</strong> Verified by ALX Data Engine
                    </div>`;
            };
            nav.appendChild(div);
        });
    </script>
</body>
</html>
