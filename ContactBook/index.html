<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="../style.css">
    <style>
        .contact-container { max-width: 600px; margin: 100px auto; }
        input { width: 100%; padding: 15px; margin-bottom: 20px; border: 1px solid var(--border); background: transparent; }
        .contact-item { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="contact-container">
        <h2 style="font-family: var(--serif); text-align: center; font-size: 2.5rem;">Nexus Directory</h2>
        <input type="text" placeholder="Name">
        <input type="text" placeholder="Phone">
        <button class="btn-lux" style="width: 100%;">Add to Registry</button>
        <div id="list" style="margin-top: 50px;">
            <div class="contact-item">
                <span>Jane Smith</span>
                <span style="color: var(--gold);">+27 60 744 6370</span>
            </div>
        </div>
    </div>
</body>
</html>
