<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Contact Ledger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <div id="view-api" class="view active-view">
        <h2 class="gold-text">System Initialization</h2>
        <p class="sub-text">Enter your API Key to access the cloud ledger.</p>
        <input type="password" id="api-input" placeholder="Enter API Key...">
        <button onclick="saveKey()">INITIALIZE SYSTEM</button>
    </div>

    <div id="view-list" class="view">
        <h2 class="gold-text">Cloud Contacts</h2>
        <div id="contact-list" class="scroll-area">
            </div>
        <button class="outline-btn" onclick="switchView('view-add')">+ ADD NEW ENTRY</button>
        <button class="ghost-btn" onclick="resetKey()">LOGOUT / RESET KEY</button>
    </div>

    <div id="view-add" class="view">
        <h2 class="gold-text">New Data Entry</h2>
        <input type="text" id="name-input" placeholder="Full Name">
        <input type="email" id="email-input" placeholder="Email Address">
        <input type="tel" id="phone-input" placeholder="Phone Number">
        <button onclick="addContact()">SAVE TO CLOUD</button>
        <button class="ghost-btn" onclick="switchView('view-list')">CANCEL</button>
    </div>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
