<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../style.css">
    <style>
        :root { --gold: #C5A059; --dark: #1a1a1a; }
        body { background: #050505; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .hero-header { text-align: center; padding: 60px; border-bottom: 2px solid var(--gold); }
        .hero-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 50px; }
        .hero-card { background: #111; border: 1px solid #333; padding: 25px; transition: 0.4s; }
        .hero-card:hover { border-color: var(--gold); transform: translateY(-10px); }
        .stat-bar { background: #333; height: 10px; border-radius: 5px; margin: 15px 0; overflow: hidden; }
        .stat-fill { background: var(--gold); height: 100%; }
    </style>
</head>
<body>
    <div class="hero-header">
        <h1 style="letter-spacing: 5px; color: var(--gold);">AVENGERS DOSSIER</h1>
        <p>S.H.I.E.L.D. DATA INTERFACE V4.0</p>
    </div>
    <div id="hero-grid" class="hero-grid"></div>

    <script>
        const heroes = [
            { name: "Iron Man", power: 95, intel: 100, skill: "Engineering" },
            { name: "Captain America", power: 85, intel: 90, skill: "Strategy" },
            { name: "Thor", power: 100, intel: 80, skill: "Combat" },
            { name: "Black Widow", power: 70, intel: 95, skill: "Espionage" },
            { name: "Hulk", power: 100, intel: 65, skill: "Strength" },
            { name: "Hawkeye", power: 75, intel: 85, skill: "Precision" }
        ];

        document.getElementById('hero-grid').innerHTML = heroes.map(h => `
            <div class="hero-card">
                <h2 style="color: var(--gold);">${h.name}</h2>
                <p>Specialty: ${h.skill}</p>
                <label>Power Level</label><div class="stat-bar"><div class="stat-fill" style="width: ${h.power}%"></div></div>
                <label>Intelligence</label><div class="stat-bar"><div class="stat-fill" style="width: ${h.intel}%"></div></div>
            </div>
        `).join('');
    </script>
</body>
</html>
