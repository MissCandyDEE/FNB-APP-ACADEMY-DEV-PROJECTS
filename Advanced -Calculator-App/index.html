<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Engineering Console</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar">
        <h2 style="color: var(--gold); font-size: 1rem; letter-spacing: 2px;">DEV CONSOLE</h2>
        <p style="font-size: 0.7rem; color: #666; margin-bottom: 20px;">FNB APP ACADEMY / ALX</p>
        <button class="nav-btn active" onclick="runModule('calc')">Advanced Calculator</button>
        <button class="nav-btn" onclick="runModule('scope')">Variable Scope Lab</button>
        <button class="nav-btn" onclick="runModule('strings')">String/Number Engine</button>
        <button class="nav-btn" onclick="runModule('auth')">Auth & Password Logic</button>
        <button class="nav-btn" onclick="runModule('switch')">Switch Case Router</button>
        <div style="margin-top: auto;"><a href="../index.html" style="color: var(--gold); text-decoration: none; font-size: 0.8rem;">← MASTER HUB</a></div>
    </div>

    <div class="main">
        <div id="calc-interface">
            <h2 id="mod-title" style="color: var(--gold);">Advanced Calculator</h2>
            <div class="calc-ui">
                <div class="screen" id="display">0</div>
                <div class="calc-grid">
                    <button class="calc-btn" onclick="press('7')">7</button>
                    <button class="calc-btn" onclick="press('8')">8</button>
                    <button class="calc-btn" onclick="press('9')">9</button>
                    <button class="calc-btn op" onclick="press('/')">/</button>
                    
                    <button class="calc-btn" onclick="press('4')">4</button>
                    <button class="calc-btn" onclick="press('5')">5</button>
                    <button class="calc-btn" onclick="press('6')">6</button>
                    <button class="calc-btn op" onclick="press('*')">×</button>
                    
                    <button class="calc-btn" onclick="press('1')">1</button>
                    <button class="calc-btn" onclick="press('2')">2</button>
                    <button class="calc-btn" onclick="press('3')">3</button>
                    <button class="calc-btn op" onclick="press('-')">-</button>
                    
                    <button class="calc-btn clr" onclick="clr()">C</button>
                    <button class="calc-btn" onclick="press('0')">0</button>
                    <button class="calc-btn op wide" onclick="eq()">=</button>
                </div>
            </div>
        </div>

        <div id="terminal-out" class="terminal">> System ready. Select a module to verify logic...</div>
        
        <div id="history-panel" style="margin-top: 20px;">
            <h3 style="color: var(--gold); font-size: 0.8rem;">RECENT CALCULATIONS</h3>
            <ul id="history-list" style="list-style: none; padding: 0; font-size: 0.8rem; color: #888;"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
